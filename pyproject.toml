[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "handtex"
version = "0.1.0"
description = "Turn your handwriting into a font and read whiteboards into LaTeX."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "fonttools>=4.40",
    "pillow>=9.0",
    "numpy>=1.23",
    "scikit-image>=0.20",
]

[project.optional-dependencies]
local = ["torch>=2.0"]
vision = ["anthropic>=0.39"]
dev = ["pytest>=7.0", "torch>=2.0"]

[project.scripts]
handtex = "handtex.cli:main"

[tool.setuptools.packages.find]
include = ["handtex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
